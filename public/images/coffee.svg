      <stop offset="0%" stop-color="#fff5f7" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>
    <linearGradient id="teaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
