  <path d="M 200 149 C 200 144 194 139 188 139 C 182 139 178 144 178 149 C 178 158 200 168 200 170 C 200 168 222 158 222 149 C 222 144 218 139 212 139 C 206 139 200 144 200 149 Z" fill="#fff" transform="scale(0.55) translate(163, 115)" />
  <!-- Gentle Steam lines with heart -->
  <path d="M 185 125 Q 175 105 190 90" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 215 125 Q 225 105 210 90" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <!-- Floating Little Steam Heart -->
  <path d="M 200 75 C 200 70 196 66 191 66 C 186 66 182 70 182 75 C 182 82 200 90 200 92 C 200 90 218 82 218 75 C 218 70 214 66 209 66 C 204 66 200 70 200 75 Z" fill="#f43f5e" opacity="0.75" />
