<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="gardenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#fce7f3" />
      <stop offset="100%" stop-color="#fdf2f8" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#gardenBg)" />
  <!-- Stems -->
  <path d="M 160 270 Q 170 200 165 140" fill="none" stroke="#86efac" stroke-width="4" stroke-linecap="round" />
  <path d="M 200 270 Q 200 190 200 120" fill="none" stroke="#4ade80" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 240 270 Q 230 210 235 150" fill="none" stroke="#86efac" stroke-width="4" stroke-linecap="round" />
  <!-- Leaves -->
  <path d="M 168 200 Q 130 190 145 220 C 155 210 165 205 168 200 Z" fill="#86efac" />
  <path d="M 232 205 Q 270 195 255 225 C 245 215 235 210 232 205 Z" fill="#86efac" />
  <!-- Left Tulip (Blush) -->
  <g transform="translate(165, 135)">
    <path d="M 0 0 C -25 -20 -20 -45 0 -40 C 20 -45 25 -20 0 0 Z" fill="#f472b6" />
    <path d="M -15 -10 C -25 -30 -5 -40 0 -25 C 5 -40 25 -30 15 -10 Z" fill="#fb7185" />
    <circle cx="0" cy="-22" r="6" fill="#fff" opacity="0.6" />
  </g>
  <!-- Center Main Tulip (Rose Red) -->
  <g transform="translate(200, 115)">
    <path d="M 0 0 C -30 -25 -25 -55 0 -50 C 25 -55 30 -25 0 0 Z" fill="#fb7185" />
    <path d="M -18 -12 C -30 -35 -5 -48 0 -30 C 5 -48 30 -35 18 -12 Z" fill="#f43f5e" />
    <circle cx="0" cy="-26" r="8" fill="#fff" opacity="0.7" />
  </g>
  <!-- Right Tulip (Soft Pink) -->
  <g transform="translate(235, 145)">
    <path d="M 0 0 C -25 -20 -20 -45 0 -40 C 20 -45 25 -20 0 0 Z" fill="#f472b6" />
    <path d="M -15 -10 C -25 -30 -5 -40 0 -25 C 5 -40 25 -30 15 -10 Z" fill="#fda4af" />
    <circle cx="0" cy="-22" r="6" fill="#fff" opacity="0.6" />
  </g>
  <!-- Ribbon around stems -->
  <ellipse cx="200" cy="225" rx="22" ry="7" fill="#fb7185" />
  <!-- Floating Petals & Sparkles -->
  <circle cx="100" cy="90" r="3" fill="#fb7185" opacity="0.7" />
  <circle cx="300" cy="80" r="2.5" fill="#f472b6" opacity="0.7" />
  <circle cx="280" cy="180" r="3.5" fill="#fda4af" opacity="0.6" />
  <circle cx="120" cy="170" r="2.5" fill="#fda4af" opacity="0.6" />
</svg>
